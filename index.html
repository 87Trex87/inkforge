<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0f10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>InkForge</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav id="nav" aria-label="Main">
    <div class="brand"><img src="icon.svg" alt=""><span>InkForge</span></div>
    <button class="nav-btn" data-view="home" data-tip="Today at a glance">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-btn" data-view="clients" data-tip="Client phonebook">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M17 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg><span>Clients</span></button>
    <button class="nav-btn" data-view="book" data-tip="Appointments calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Book</span></button>
    <button class="nav-btn" data-view="studio" data-tip="Portfolio, stencils, forms, reels">
      <svg viewBox="0 0 24 24"><path d="M14 3l7 7-9 9H5v-7z"/><path d="M11 6l7 7M5 19l-2 2"/></svg><span>Studio</span></button>
    <button class="nav-btn" data-view="more" data-tip="Settings, backup, rules, stock">
      <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg><span>More</span></button>
  </nav>
  <main id="main">
    <header id="topbar"><h1 id="view-title">InkForge</h1>
      <span class="tb-right"><span class="badge ea" data-tip="InkForge is still being built. Features may change and some things may not work yet.">Early Access</span>
        <span id="db-badge" class="badge" data-tip="Database status">…</span></span></header>
    <section id="view"></section>
  </main>
</div>
<div id="tip" role="tooltip" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="import-file" accept=".inkforge,.sqlite,.db" hidden>
<script src="reel.js"></script>
<script src="app.js"></script>
</body>
</html>
